<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bustin' Hands With The Homies</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= LOBBY SCREEN ================= -->
    <div id="lobby">
        <div id="lobbyOverlay">
            <input type="text" id="playerName" placeholder="Enter your name">
            <button id="joinBtn">Join Game</button>
        </div>
        
        <!-- SCENE SELECTION SCREEN (hidden initially) -->
        <div id="sceneOverlay" style="display:none;">
            <div id="sceneContainer">
                <h2>Select Your Scene</h2>
                <button id="vampireBarBtn" class="sceneBtn">🧛 Vampire Bar</button>
                <button id="highRollerBtn" class="sceneBtn">💎 High Roller's Club</button>
                    <button id="beachPartyBtn" class="sceneBtn">🏖️ Beach Party</button>
                    <button id="templeBtn" class="sceneBtn">⛩️ Opium Den</button>
                    <button id="tailgateBtn" class="sceneBtn">🏈 GSU Tailgate</button>
            </div>
        </div>
        
        <!-- DECK SELECTION SCREEN (hidden initially) -->
        <div id="deckOverlay" style="display:none;">
            <div id="deckContainer">
                <h2>Select Your Card Deck</h2>
                <div id="deckOptions">
                    <div class="deck-option" id="deck1Option">
                        <img src="/cards/card_back.png" alt="Deck 1">
                        <button class="deckBtn" data-deck="1">Select Deck 1</button>
                    </div>
                    <div class="deck-option" id="deck2Option">
                        <img src="/cards/card_back2.png" alt="Deck 2">
                        <button class="deckBtn" data-deck="2">Select Deck 2</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ================= GAME SCREEN ================= -->
    <div id="game" style="display:none;">

        <div id="inGameHeader">
            <div class="in-game-option-group">
                <label for="sceneSelectInGame">Scene</label>
                <select id="sceneSelectInGame">
                    <option value="vampire-bar">🧛 Vampire Bar</option>
                    <option value="high-roller">💎 High Roller's Club</option>
                    <option value="beach-party">🏖️ Beach Party</option>
                    <option value="japanese-temple">⛩️ Opium Den</option>
                    <option value="gsu-tailgate">🏈 GSU Tailgate</option>
                </select>
            </div>
            <div class="in-game-option-group">
                <label for="deckSelectInGame">Deck</label>
                <select id="deckSelectInGame">
                    <option value="1">Deck 1</option>
                    <option value="2">Deck 2</option>
                </select>
            </div>
        </div>

        <div id="tableArea"></div>

        <!-- CHAT PANEL (LEFT SIDE) -->
        <div id="chatPanel" class="chat-panel">
            <div id="chatPanelHeader" class="chat-panel-header">Chat</div>
            <div id="chatMessages" class="chat-messages">
                <!-- Chat messages will be added here -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type @ to mention players...">
                <button id="emojiBtn" class="chat-emoji-btn" title="Add emoji">😊</button>
                <button id="chatSendBtn" class="chat-send-btn">Send</button>
            </div>
            <!-- Emoji Picker -->
            <div id="emojiPicker" class="emoji-picker">
                <div class="emoji-category">
                    <span class="emoji" data-emoji="😀">😀</span>
                    <span class="emoji" data-emoji="😂">😂</span>
                    <span class="emoji" data-emoji="😍">😍</span>
                    <span class="emoji" data-emoji="🤔">🤔</span>
                    <span class="emoji" data-emoji="😱">😱</span>
                    <span class="emoji" data-emoji="👍">👍</span>
                    <span class="emoji" data-emoji="🖕">🖕</span>
                    <span class="emoji" data-emoji="🎉">🎉</span>
                    <span class="emoji" data-emoji="🔥">🔥</span>
                    <span class="emoji" data-emoji="⭐">⭐</span>
                    <span class="emoji" data-emoji="💯">💯</span>
                </div>
            </div>
            <!-- @Mention Suggestions -->
            <div id="mentionSuggestions" class="mention-suggestions">
                <!-- Player suggestions will be added here -->
            </div>
        </div>

        <!-- PLAYER LIST PANEL (RIGHT SIDE) -->
        <div id="playerListPanel" class="player-list-panel">
            <div class="player-list-top">
                <div id="playerListHeader" class="player-list-header">Players</div>
            </div>
            <div id="playerListContent" class="player-list-content">
                <!-- Player list will be populated here -->
            </div>
        </div>

        <!-- STATISTICS DASHBOARD (hidden by default) -->
        <div id="statsModal" class="stats-modal" style="display:none;">
            <div class="stats-modal-content">
                <div class="stats-modal-header">
                    <h2>Game Statistics</h2>
                    <button id="closeStatsBtn" class="close-btn">×</button>
                </div>
                <div id="statsBody" class="stats-modal-body">
                    <!-- Stats will be populated here -->
                </div>
            </div>
        </div>

        <!-- TURN INDICATOR -->
        <div id="turnIndicator" style="display:none;"></div>

        <!-- BUTTONS ABOVE HAND -->
        <div id="buttonContainer">
            <button id="readyBtn">Ready</button>
            <button id="bustBtn" style="display:none;">Bust a Hand</button>
            <button id="passBtn" style="display:none;">Pass</button>
            <div id="discardCardDiv" style="display:none;">
                <div style="text-align: center;">
                    <div style="font-size: 14px; font-weight: 700; color: white; margin-bottom: 8px;">Discard</div>
                    <div id="discardCardImage"></div>
                </div>
            </div>
        </div>

        <!-- PLAYER HAND -->
        <div id="playerHand"></div>

    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script src="enhancements.js"></script>
</body>
</html>
